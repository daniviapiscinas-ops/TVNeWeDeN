name: Actualizar agenda deportiva

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  update-agenda:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Firebase Admin
        run: npm install firebase-admin

      - name: Ejecutar actualización de agenda
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/update-agenda.js
