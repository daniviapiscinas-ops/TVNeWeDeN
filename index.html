<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DANIVIA TV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d0d0d;
      color: white;
      text-align: center;
    }

    /* INTRO */
    #intro {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      flex-direction: column;
      animation: fadeOut 2s ease 3s forwards;
    }

    #intro img {
      width: 200px;
      animation: zoom 2s ease;
    }

    @keyframes zoom {
      from {transform: scale(0.5); opacity: 0;}
      to {transform: scale(1); opacity: 1;}
    }

    @keyframes fadeOut {
      to {opacity: 0; visibility: hidden;}
    }

    header {
      padding: 20px;
    }

    header img {
      width: 120px;
    }

    h1 {
      margin-top: 10px;
      color: gold;
    }

    section {
      margin: 30px;
    }

    .card {
      background: #1a1a1a;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <img src="logo.jpg" alt="logo">
</div>

<!-- CONTENIDO -->
<header>
  <img src="logo.jpg" alt="logo">
  <h1>DANIVIA TV</h1>
</header>

<section>
  <h2>⚽ Agenda Deportiva</h2>
  <div class="card">Próximamente...</div>
</section>

<section>
  <h2>🎬 Últimas Películas</h2>
  <div class="card">Próximamente...</div>
</section>

<section>
  <h2>📺 Últimas Series</h2>
  <div class="card">Próximamente...</div>
</section>

</body>
</html>
