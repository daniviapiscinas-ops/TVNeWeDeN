<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DANIVIA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0d0d0d;
  color: white;
  text-align: center;
}

#intro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  animation: fadeOut 2s ease 3s forwards;
}

#intro img {
  width: 200px;
  animation: zoom 2s;
}

@keyframes zoom {
  from {transform: scale(0.5); opacity: 0;}
  to {transform: scale(1);}
}

@keyframes fadeOut {
  to {opacity: 0; visibility: hidden;}
}

header img {
  width: 120px;
}

h1 {
  color: gold;
}

.card {
  background: #1a1a1a;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
}

/* ADMIN */
#adminPanel {
  display: none;
  background: #111;
  padding: 20px;
  margin: 20px;
  border: 1px solid gold;
}
input, button {
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<div id="intro">
  <img src="logo.jpg">
</div>

<header>
  <img src="logo.jpg">
  <h1>DANIVIA TV</h1>
</header>

<!-- LOGIN -->
<div>
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">
  <button onclick="login()">Login Admin</button>
  <button onclick="logout()">Logout</button>
</div>

<!-- PANEL ADMIN -->
<div id="adminPanel">
  <h2>Panel Admin</h2>
  <input id="titulo" placeholder="Título">
  <input id="tipo" placeholder="pelicula / serie / deporte">
  <button onclick="guardar()">Guardar</button>
</div>

<section>
  <h2>⚽ Agenda Deportiva</h2>
  <div id="deportes"></div>
</section>

<section>
  <h2>🎬 Películas</h2>
  <div id="peliculas"></div>
</section>

<section>
  <h2>📺 Series</h2>
  <div id="series"></div>
</section>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBU_NaJoIBweCc_xfU3t92CkBdi7McPqdI",
  authDomain: "daniviatv-8ccbc.firebaseapp.com",
  projectId: "daniviatv-8ccbc",
  storageBucket: "daniviatv-8ccbc.firebasestorage.app",
  messagingSenderId: "481386290072",
  appId: "1:481386290072:web:af80ef40bd52db3f33a9ed"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("adminPanel").style.display = "block";
    alert("Login correcto");
  } catch (e) {
    alert("Error login");
  }
}

window.logout = function() {
  signOut(auth);
  document.getElementById("adminPanel").style.display = "none";
}

window.guardar = async function() {
  const titulo = document.getElementById("titulo").value;
  const tipo = document.getElementById("tipo").value;

  await addDoc(collection(db, "contenido"), {
    titulo,
    tipo
  });
}

/* MOSTRAR DATOS EN TIEMPO REAL */
onSnapshot(collection(db, "contenido"), (snapshot) => {
  document.getElementById("peliculas").innerHTML = "";
  document.getElementById("series").innerHTML = "";
  document.getElementById("deportes").innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();
    const div = `<div class="card">${data.titulo}</div>`;

    if(data.tipo === "pelicula") {
      document.getElementById("peliculas").innerHTML += div;
    }
    if(data.tipo === "serie") {
      document.getElementById("series").innerHTML += div;
    }
    if(data.tipo === "deporte") {
      document.getElementById("deportes").innerHTML += div;
    }
  });
});
</script>

</body>
</html>
