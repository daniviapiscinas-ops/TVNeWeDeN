<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>DANIVIA TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
}

/* INTRO */
#intro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  animation: fadeOut 2s ease 3s forwards;
}

#intro img {
  width: 220px;
  animation: zoom 2s;
}

@keyframes zoom {
  from {transform: scale(0.5); opacity: 0;}
  to {transform: scale(1);}
}

@keyframes fadeOut {
  to {opacity: 0; visibility: hidden;}
}

/* HEADER */
header {
  text-align: center;
  padding: 20px;
}

header img {
  width: 120px;
}

h1 {
  color: gold;
}

/* AGENDA */
.agenda-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
  padding: 20px;
}

.agenda-card {
  background: linear-gradient(145deg, #181818, #0b0b0b);
  border: 1px solid rgba(255, 215, 0, 0.3);
  border-radius: 15px;
  padding: 15px;
}

.agenda-card h3 {
  margin: 10px 0;
}

.agenda-card p {
  color: #ccc;
}

.league {
  color: gold;
  font-size: 12px;
  font-weight: bold;
}

/* ADMIN */
#adminPanel {
  display: none;
  padding: 20px;
}

input, button {
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <img src="logo.jpg">
</div>

<header>
  <img src="logo.jpg">
  <h1>DANIVIA TV</h1>
</header>

<!-- LOGIN -->
<div style="text-align:center;">
  <input id="email" placeholder="email">
  <input id="password" type="password" placeholder="password">
  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>
</div>

<!-- ADMIN -->
<div id="adminPanel">
  <h2>Panel Admin</h2>
  <input id="titulo" placeholder="Título">
  <input id="tipo" placeholder="pelicula / serie / deporte">
  <button onclick="guardar()">Guardar</button>
</div>

<!-- AGENDA -->
<section>
  <h2 style="text-align:center;">⚽ Agenda Deportiva España</h2>
  <div id="agenda" class="agenda-grid"></div>
</section>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBU_NaJoIBweCc_xfU3t92CkBdi7McPqdI",
  authDomain: "daniviatv-8ccbc.firebaseapp.com",
  projectId: "daniviatv-8ccbc",
  storageBucket: "daniviatv-8ccbc.firebasestorage.app",
  messagingSenderId: "481386290072",
  appId: "1:481386290072:web:af80ef40bd52db3f33a9ed"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

/* LOGIN */
window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    document.getElementById("adminPanel").style.display = "block";
  } catch {
    alert("Error login");
  }
}

window.logout = function() {
  signOut(auth);
  document.getElementById("adminPanel").style.display = "none";
}

/* GUARDAR */
window.guardar = async function() {
  const titulo = document.getElementById("titulo").value;
  const tipo = document.getElementById("tipo").value;

  await addDoc(collection(db, "contenido"), { titulo, tipo });
}

/* AGENDA AUTOMÁTICA */
onSnapshot(collection(db, "agenda"), (snapshot) => {
  const agenda = document.getElementById("agenda");
  agenda.innerHTML = "";

  snapshot.forEach(doc => {
    const d = doc.data();

    agenda.innerHTML += `
      <div class="agenda-card">
        <div class="league">${d.liga}</div>
        <h3>${d.partido}</h3>
        <p>📅 ${d.fecha}</p>
        <p>⏰ ${d.hora}</p>
        <p>🏟️ ${d.estadio}</p>
      </div>
    `;
  });
});
</script>

</body>
</html>
